<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternShield | Detect Internship Scams</title>
    <meta name="description" content="Protect yourself from internship scams. Paste a link or job description to check for red flags like registration fees and urgent hiring.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <div class="nav-logo">
                    <img src="logo.png" alt="InternShield Logo" class="nav-logo-img">
                    <span class="nav-title">InternShield</span>
                </div>
            </div>
            <div class="nav-right">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#tips-section">Safety Tips</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="signup.html">Sign Up</a></li>
                </ul>
                <button id="dark-mode-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                    <span class="sun-icon">☀️</span>
                    <span class="moon-icon">🌙</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <header class="header">
            <h1 class="title">Detect Fake Internships</h1>
            <p class="subtitle">Protect yourself from scam internships</p>
        </header>

        <section class="checker-card">
            <div class="mode-selector">
                <button id="text-mode-btn" class="mode-btn active" data-mode="text">Text/Link</button>
                <button id="file-mode-btn" class="mode-btn" data-mode="file">Upload File</button>
                <button id="link-mode-btn" class="mode-btn" data-mode="link">Link Scanner</button>
            </div>

            <div id="text-mode" class="input-mode active">
                <div class="input-group">
                    <label for="internship-input">Paste Internship Text or Link</label>
                    <textarea id="internship-input" placeholder="Paste the job description, social media post, or link here..." aria-label="Internship content"></textarea>
                </div>
            </div>

            <div id="file-mode" class="input-mode">
                <div class="input-group">
                    <label for="file-upload">Upload Screenshot or File</label>
                    <div class="file-upload-area">
                        <input type="file" id="file-upload" accept="image/*,.pdf,.txt,.doc,.docx" aria-label="File upload">
                        <div class="upload-prompt">
                            <span class="upload-icon">📤</span>
                            <p>Click to upload or drag and drop</p>
                            <small>PNG, JPG, PDF, TXT, DOC (Max 5MB)</small>
                        </div>
                        <div id="file-preview" class="file-preview hidden"></div>
                    </div>
                </div>
            </div>

            <div id="link-mode" class="input-mode">
                <div class="input-group">
                    <label for="link-input">Scan URL for Scams</label>
                    <input type="url" id="link-input" placeholder="Enter the internship URL (https://...)" aria-label="URL input">
                </div>
            </div>

            <button id="check-btn" class="primary-btn">
                <span>Check for Scams</span>
                <div class="btn-shine"></div>
            </button>
        </section>

        <section id="result-section" class="result-section hidden">
            <div id="result-card" class="result-card">
                <div class="result-header">
                    <div id="status-icon" class="status-icon"></div>
                    <h2 id="status-text">Analysis Complete</h2>
                </div>
                <div class="result-body">
                    <p id="result-summary"></p>
                    <ul id="reasons-list" class="reasons-list"></ul>
                </div>
                <button id="reset-btn" class="secondary-btn">Check Another</button>
            </div>
        </section>

        <footer class="footer">
            <p>&copy; 2026 InternShield. Stay Safe, Get Hired.</p>
        </footer>
    </main>

    <!-- Tips Modal -->
    <div id="tips-modal" class="modal hidden">
        <div class="modal-content">
            <button id="close-tips-modal" class="close-btn" aria-label="Close tips modal">&times;</button>
            <h2 class="tips-title">💡 Safety Tips</h2>
            <div class="tips-container" id="tips-container"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
